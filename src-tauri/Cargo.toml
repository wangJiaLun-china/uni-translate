[package]
name = "uni-translate"
version = "0.1.2"
description = "A lightweight AI translator for any OpenAI-compatible API"
authors = ["wangjialun"]
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "uni_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
whatlang = "0.18"
uuid = { version = "1", features = ["v4"] }
arboard = "3"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry"] }
tauri-nspanel = "2.1"

[target.'cfg(windows)'.dependencies]
enigo = "0.6"

[dev-dependencies]
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
